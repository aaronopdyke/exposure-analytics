# =========================================================================
# Exposure Analytics - configuration
#
# Compares seven building-exposure datasets (GAR15, GIRI, GEM v2023/v2026,
# Overture, GBA, Microsoft) per country.
# Data stays on Drive under "World Bank/Exposure Analytics" (auto-detected);
# shared inputs (WB boundaries, GHSL) and the GBA/Overture extractions are
# reused from the sibling "Global Building Forecast" project.
# =========================================================================

country_iso: "MAR"         # default for the notebook / tools run without an ISO
data_root: null            # null -> auto-detect (env DATA_ROOT / Colab / G:)

# -------------------------------------------------------------------------
# Countries published on the site. Everything country-specific that is not
# derivable from the data lives here:
#   name            short display name (site brand, deck cover, file names)
#   label           long label for meta.json (defaults to name)
#   gem2023_path    folder of the GEM v2023.1.1 per-country summary
#   msb_regions     Microsoft GlobalML "Location" names ([] = no coverage)
#   gar15           where UNISDR's per-country GAR15 grid has no file for
#                   the country: `false` leaves the model out;
#                   `{national_usd: ...}` (as published, from GAR15's country
#                   results) shows it as a country total only
#   gem_name_aliases GEM region name -> display-unit name, where they differ
#                   (only for countries matched by NAME; MAR has a curated
#                   code crosswalk in src/gem.py)
#   unit_names      WB Admin-1 name -> display name, where the WB layer
#                   carries an outdated or unaccented name
#   units           set when the WB Admin-1 layer has no usable subdivisions
#   grade           exposure base of a World Bank GRADE for the country, as
#                   reported (buildings AND contents, US$ of price_year) -
#                   drawn against the models on the deck's GRADE slide
#   benchmarks      other published exposure values to draw on that slide,
#                   by display unit (used where there is no GRADE)
# -------------------------------------------------------------------------
countries:
  MAR:
    name: "Morocco"
    label: "Morocco (Western Sahara shown as one separate unit)"
    gem2023_path: "Africa/Morocco"
    msb_regions: ["Morocco"]
    grade:
      event: "2023 Al Haouz earthquake"
      price_year: 2023          # US$ of the report year
      stock_year: 2023
      residential_usd: 277.0e+9      # buildings and contents
      non_residential_usd: 201.0e+9  # buildings and contents
    notes:
      gem: "GEM regions matched to WB Admin-1 boundaries; GEM's two southern regions are assigned to the WB Western Sahara unit"
      site:
        - "WB Official Boundaries draw Morocco ending at 27.67°N and carry Western Sahara only as a 'non-determined legal status area' with no Admin-1 subdivisions. It is shown as one whole, hatched unit appended to the display - never subdivided and never merged into a member state. WB keeps a small sliver of Laâyoune-Sakia al Hamra north of that line, which is why that unit shows very small totals in every dataset."
        - "GEM models the 12 official Moroccan regions including the far south; its two southern regions (Laâyoune-Sakia El Hamra, Dakhla-Oued Ed-Dahab) lie almost wholly south of the WB line and are assigned to the Western Sahara unit. GAR15 publishes Western Sahara as a separate file, which supplies that unit."
        - "Google Open Buildings v3 is excluded: it has essentially no coverage here (77 buildings in the whole country partition)."
  COL:
    name: "Colombia"
    gem2023_path: "South_America/Colombia"
    msb_regions: ["Colombia"]
    grade:
      event: "2026 earthquake"
      price_year: 2026          # US$ of the report year
      stock_year: 2026
      residential_usd: 658.0e+9      # buildings and contents
      non_residential_usd: 344.0e+9  # buildings and contents
    gem_name_aliases:
      "Distrito Capital de Bogotá": "Bogotá, D.C."
      "Bogota": "Bogotá, D.C."
      "San Andrés y Providencia": "Archipiélago de San Andrés, Providencia y Santa Catalina"
    # deck maps: zoom to the mainland and draw these units in an inset box
    # (the archipelago's outlying cays reach 15.8N and would otherwise
    # shrink the whole map)
    map_insets:
      - units: ["COL004"]
        label: "San Andrés y\nProvidencia"
  MHL:
    name: "Marshall Islands"
    gem2023_path: "Oceania/Marshall_Islands"
    msb_regions: []          # no Microsoft GlobalML tiles over the country
    benchmarks:
      # World Bank Spotlight (2026), "Mapping Risk, Building Resilience -
      # Exposure Analysis of Pacific Urban Areas", Figure 15: value of the
      # building stock per city (buildings only, 2024 stock, 2025 US$).
      # Read off the chart bars, so good to about +/- $0.1 billion. The
      # study is city-based; `unit` is the atoll each city sits on.
      - source: "Pacific Spotlight (2026)"
        price_year: 2025
        note: "Pacific Spotlight: World Bank (2026), Mapping Risk, Building Resilience - Exposure Analysis of Pacific Urban Areas, Figure 15 (buildings only, 2024 stock, 2025 US$). Values read off the chart, to about ±$0.1 billion."
        places:
          - {name: "Majuro", unit: "Majuro", usd: 2.6e+9}
          - {name: "Ebeye", unit: "Kwajalein", usd: 0.8e+9}
    gem_name_aliases:
      "Enewetak & Ujelang": "Enewetak"
      "Enewatak": "Enewetak"
      "Utrik": "Utirik"
      "Bikini & Kili": "Kili"   # Bikini's population (and stock) is on Kili
    units:
      # WB Admin-1 carries the whole country as ONE unit ("Administrative
      # unit not available"). The WB polygon is split into atolls using the
      # SPC / OCHA COD-AB atoll names (HDX, CC BY-IGO); each unit is drawn
      # and aggregated as an atoll envelope (convex hull + buffer) because
      # islets are far too small to see or to catch grid cells at 5 km.
      kind: "atolls"
      hdx_id: "cod-ab-mhl"
      hull_buffer_deg: 0.04
      rename: {"Eneu": "Bikini"}

  VEN:
    name: "Venezuela"
    gem2023_path: "South_America/Venezuela"
    msb_regions: ["Venezuela"]
    # GAR15's per-country grid (HDX, mirrored by Stanford) has no
    # Venezuela file, and the original UNISDR/GRID download hosts are
    # offline. The national capital stock is TOT_STOCK (US$ million) for
    # VEN in GAR15's country results (Stanford purl nd563yc9685); the
    # same field matches the gridded totals of COL, MAR and MHL to
    # within 1.5%. Shown as a country total only - no map or split.
    gar15:
      national_usd: 1154527.75e+6   # as published (~2013 US$, see src/deflate.py)
    unit_names:
      "Vargas": "La Guaira"          # renamed in 2019
      "Anzoategui": "Anzoátegui"
      "Bolivar": "Bolívar"
      "Falcon": "Falcón"
      "Guarico": "Guárico"
      "Merida": "Mérida"
      "Tachira": "Táchira"
    gem_name_aliases:
      "Vargas": "La Guaira"          # GEM v2023.1.1 keeps the old name
    grade:
      # World Bank (2026), GRADE Report - Venezuela Earthquakes, June 24,
      # 2026 (report as of July 13, 2026), Table 2: nationwide exposure.
      event: "June 2026 earthquakes"
      price_year: 2026          # US$ of the report year
      stock_year: 2026
      residential_usd: 667.26e+9      # buildings and contents
      non_residential_usd: 264.71e+9  # buildings and contents
      infrastructure_usd: 473.98e+9   # not compared (models are buildings only)

boundaries:
  # WB Official Boundaries stop Morocco at 27.67N; Western Sahara exists only
  # as an ADM0 polygon (ESH, "Non-determined legal status area") with NO ADM1
  # subdivisions. include_esh appends it to country maps as ONE whole unit.
  include_esh: true
  esh_label: "Western Sahara (no ADM1 subdivisions - WB non-determined status)"

sources:
  gar15:   # UNISDR GAR15 Global Exposure Dataset (GEG-15), ~5km (1km coast)
    # per-country downloads, resolved by ISO3 via the HDX CKAN API
    # (package_search fq=groups:{iso}); e.g. Morocco:
    # https://data.humdata.org/dataset/gar15-global-exposure-dataset-for-morocco
    # world: https://earthworks.stanford.edu/catalog/stanford-nd563yc9685
    # values in MILLIONS of 2015 USD (tot_val = tot_cu + tot_cr)
    cache_subdir: "GAR15"
  giri:    # GIRI Building Exposure Model (BEM), 5x5km value rasters (USD)
    # portal: https://giri.unepgrid.ch  (res / non-res building stock USD)
    # direct GeoTIFFs (global, EPSG:4326, ~0.0417 deg, nodata -9999):
    base_url: "https://hazards-data.unepgrid.ch/"
    files:
      total: "bem_5x5_valfis.tif"
      res: "bem_5x5_valfis_res.tif"
      nres: "bem_5x5_valfis_nres.tif"
    cache_subdir: "GIRI"
  gem:     # GEM Global Exposure Model - ADM1 x taxonomy summary
    adm1_taxonomy_url: "https://raw.githubusercontent.com/gem/global_exposure_model/main/World/summaries/Exposure_Summary_Adm1_Taxonomy.csv"
    cache_subdir: "GEM"
  gba:     # Global Building Atlas LoD1 (source.coop parquet tiles, DuckDB)
    base_url: "https://data.source.coop/tge-labs/globalbuildingatlas-lod1"
    s3_pattern: "s3://us-west-2.opendata.source.coop/tge-labs/globalbuildingatlas-lod1/*.parquet"
  overture:  # Overture Maps buildings (pinned release, DuckDB over S3)
    # Old releases are deleted from the bucket, so the pin moves forward; the
    # release each country was extracted from is recorded beside its cache
    # (Outputs/overture_adm1_<iso>.json). MAR was extracted from 2026-06-17.0.
    url: "s3://overturemaps-us-west-2/release/2026-10-21.0/theme=buildings/type=building/*"
    legacy_release: "2026-06-17.0"   # caches written before releases were recorded
